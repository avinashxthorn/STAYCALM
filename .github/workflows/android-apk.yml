name: STAYCALM · Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: staycalm-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare offline font and verify four audio tracks
        run: bash scripts/fetch-assets.sh
      - name: Verify local unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK integrity, package and Android signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.staycalm.focus'"
          mkdir -p dist
          cp "$APK" dist/STAYCALM.apk
          (cd dist && sha256sum STAYCALM.apk > STAYCALM.apk.sha256)
          echo "Validated APK bytes: $(wc -c < dist/STAYCALM.apk)"
          cat dist/STAYCALM.apk.sha256
      - name: Publish direct installable APK through GitHub Releases
        # GitHub Actions artifacts are always ZIP downloads. Release assets are
        # raw APKs that Android users can install without extracting an archive.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/STAYCALM.apk dist/STAYCALM.apk.sha256 --clobber
          else
            gh release create "$TAG" \
              dist/STAYCALM.apk dist/STAYCALM.apk.sha256 \
              --target "${GITHUB_SHA}" \
              --title "STAYCALM 3.7.6 - Direct APK (build ${GITHUB_RUN_NUMBER})" \
              --notes "Download STAYCALM.apk directly (do not download Source code ZIP or an Actions artifact). This debug-signed APK passed unit tests, lint, archive integrity, package and Android signature checks. GitHub runners may produce different debug certificates; installing over an old STAYCALM may fail with a signature mismatch. Do not uninstall without preserving important local data." \
              --latest
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: STAYCALM-v3.7.6-verified-debug-apk-zip
          path: dist/STAYCALM.apk
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android UI and session flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/verify-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STAYCALM-verification
          path: |
            app/build/reports/
            ui-screenshots/
          retention-days: 14
