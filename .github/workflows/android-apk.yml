name: STAYCALM · Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: staycalm-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare offline font and verify four audio tracks
        run: bash scripts/fetch-assets.sh
      - name: Verify local unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: STAYCALM-v3.7.2-planner-reminders-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android UI and session flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/verify-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STAYCALM-verification
          path: |
            app/build/reports/
            ui-screenshots/
          retention-days: 14
